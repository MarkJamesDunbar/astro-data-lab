# Stage 1 of the foundation model: self-supervised pre-training, no labels.
# Every training-split curve (~439,000, ~830 GB of FITS) is downloaded once, used,
# and deleted. Each pass hides 40% of each curve's ~2-hour patches and the encoder
# learns to fill them in. Download-bound: ~12 hours at ~10 curves/s.
# Fine-tune afterwards with experiments/transit_foundation.toml.

[run]
name = "foundation-v1"
target = "pretrain"

[data]
curves_per_round = 2048
rounds = 0                       # 0 = until every training-split curve has been used once
validation_curves_per_class = 300 # validation stars used for the linear probe (labels only for scoring)
download_workers = 16

[training]
passes_per_round = 3             # new random masks each pass, so repeats are not identical
minibatch_size = 32
learning_rate = 0.0002
weight_decay = 0.05

[model]
factory = "astro_data_lab.models:MaskedPatchPretrainer"

[model.options]
patch = 64                       # readings per token (~2 hours)
width = 384
depth = 8
heads = 8
dropout = 0.0
mask_fraction = 0.4
