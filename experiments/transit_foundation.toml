# Stage 2 of the foundation model: fine-tune the pre-trained encoder to flag transits.
# Identical to transit_transformer_large.toml except `init_from`, so the difference
# between their test scores is the effect of pre-training.

[run]
name = "transit-foundation-v1"
target = "transit"

[data]
curves_per_round = 1024
injected_fraction = 0.5
rounds = 100
validation_curves_per_class = 300
download_workers = 16

[training]
passes_per_round = 3
minibatch_size = 32
learning_rate = 0.0001
weight_decay = 0.0001

[model]
factory = "astro_data_lab.models:PatchTransformer"
init_from = "foundation-v1"      # copy the encoder from the pre-training run's best checkpoint

[model.options]
patch = 64                       # must match the pre-training run, so every encoder weight fits
width = 384
depth = 8
heads = 8
dropout = 0.1
