# Does this light curve contain a transit-like signal? CNN example.
# Change anything below -> give the experiment a new name.

[run]
name = "transit-cnn-v1"
target = "transit"

[data]
curves_per_round = 1024      # half signal, half no_signal
injected_fraction = 0.5      # half the signal examples: this round's no_signal curves + a synthetic transit
rounds = 100                 # 0 = keep going until stopped
validation_curves_per_class = 300

[training]
passes_per_round = 3          # downloads are the bottleneck, so reuse each round
minibatch_size = 32
learning_rate = 0.001

[model]
factory = "astro_data_lab.models:LightCurveCNN"

[model.options]
width = 32
