# Same task and data as transit_cnn.toml; only the model differs, so the two
# test scores can be compared directly.

[run]
name = "transit-transformer-v1"
target = "transit"

[data]
curves_per_round = 1024
injected_fraction = 0.5
rounds = 100
validation_curves_per_class = 300

[training]
passes_per_round = 3          # downloads are the bottleneck, so reuse each round
minibatch_size = 32
learning_rate = 0.0005       # Transformers usually want a smaller step than CNNs

[model]
factory = "astro_data_lab.models:PatchTransformer"

[model.options]
patch = 64                   # readings per token (~2 hours)
width = 64
depth = 4
heads = 4
